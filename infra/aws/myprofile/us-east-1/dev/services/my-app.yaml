#
# my-app.yaml
#

modules:
  bucket:
    source: aws/5/s3-bucket

  lock_table:
    source: aws/5/dynamodb
    vars:
      dynamodb_hash_key: LockID

  app_user_policy:
    source: aws/5/iam-policy
    vars:
      iam_policy_statements:
        - effect: Allow
          actions: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
          resources:
            - ${module.bucket.bucket_arn}
            - ${module.bucket.bucket_arn}/*
        - effect: Allow
          actions: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:DeleteItem, dynamodb:DescribeTable]
          resources:
            - ${module.lock_table.table_arn}

  app_user:
    source: aws/5/iam-user
    vars:
      iam_user_create_access_key: false    # no credentials needed — uses instance profile
      iam_user_attach_policy_arns:
        - ${module.app_user_policy.policy_arn}

  cicd_user_policy:
    source: aws/5/iam-policy
    vars:
      iam_policy_statements:
        - effect: Allow
          actions: [s3:PutObject, s3:DeleteObject, s3:ListBucket]
          resources:
            - ${module.bucket.bucket_arn}
            - ${module.bucket.bucket_arn}/*

  cicd_user:
    source: aws/5/iam-user
    vars:
      secrets_manager_name: "myapp/cicd-user"    # override — non-standard path for readability
      iam_user_attach_policy_arns:
        - ${module.cicd_user_policy.policy_arn}
