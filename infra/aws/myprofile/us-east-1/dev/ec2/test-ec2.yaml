#
# test-ec2.yaml
#

remote_state:
  vpc:      infra/aws/myprofile/us-east-1/base/vpc/main.yaml
  key_pair: infra/aws/myprofile/us-east-1/base/ec2/default-key-pair.yaml

modules:
  sg:
    source: aws/5/security-group
    vars:
      sg_vpc_id: ${remote.vpc.vpc_id}
      sg_ingress_rules:
        - from_port: 22
          to_port: 22
          protocol: tcp
          cidr_blocks: ["0.0.0.0/0"]

  ec2:
    source: aws/5/ec2
    vars:
      ec2_ami:                "ami-0c7217cdde317cfec"  # Ubuntu 22.04 us-east-1 — update for your region
      ec2_subnet_id:          ${remote.vpc.first_public_subnet_id}
      ec2_security_group_ids:
        - ${module.sg.security_group_id}
      ec2_key_name:           ${remote.key_pair.key_name}
      default_tags:
        managed_by: terraform
